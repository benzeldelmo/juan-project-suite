name: Workspace Regression Tests

on:
  push:
    branches:
      - workspace-stabilization-2026-10-01
      - main
    paths:
      - "workspace/**"
      - "online/**"
      - "supabase/**"
      - ".github/workflows/workspace-tests.yml"
  pull_request:
    paths:
      - "workspace/**"
      - "online/**"
      - "supabase/**"

jobs:
  test-workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax check Workspace scripts
        run: |
          for file in workspace/js/*.js; do
            node --check "$file"
          done
      - name: Extract and syntax-check Workspace inline scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("workspace/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No Workspace inline scripts found")
          out = Path("/tmp/juan-workspace-inline")
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f"inline-{i}.js").write_text(script, encoding="utf-8")
          PY
          for file in /tmp/juan-workspace-inline/*.js; do node --check "$file"; done
      - name: Run Workspace stabilization tests
        run: node --test workspace/tests/workspace-stabilization.test.mjs
