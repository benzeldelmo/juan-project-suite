name: Promote tested Vercel previews
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vercel-promote-tested.yml"
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote Workspace tested preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN secret is not configured"; exit 2; }
          npx --yes vercel@latest promote https://juan-project-workspace-ro8r841yk-juan-codes.vercel.app --scope juan-codes --token="$VERCEL_TOKEN" --yes
      - name: Promote Online tested preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx --yes vercel@latest promote https://juan-project-online-mqc3pftau-juan-codes.vercel.app --scope juan-codes --token="$VERCEL_TOKEN" --yes
