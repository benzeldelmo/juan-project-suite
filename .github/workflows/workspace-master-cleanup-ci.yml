name: Workspace master cleanup CI
on:
  push:
    branches:
      - workspace/master-cleanup-2026-10-02
  pull_request:
    branches:
      - main
jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workspace/package-lock.json
      - run: npm ci
      - run: npm test
