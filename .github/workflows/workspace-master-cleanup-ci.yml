name: Workspace maintenance CI
on:
  push:
    branches:
      - workspace/master-cleanup-2026-10-02
      - maintenance/master-goals-2026-10-06
  pull_request:
    branches:
      - main
jobs:
  workspace-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
