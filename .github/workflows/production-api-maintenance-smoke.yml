name: Production API maintenance smoke
on:
  push:
    branches:
      - maintenance/master-goals-2026-10-06
    paths:
      - ".github/workflows/production-api-maintenance-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Workspace config
        run: |
          code=$(curl -sS -o /tmp/config.json -w "%{http_code}" https://juan-project-workspace-v2.vercel.app/api/supabase-config)
          echo "Workspace config HTTP $code"
          test "$code" = "200"
          node -e "const x=require('/tmp/config.json'); if(!x.SUPABASE_URL||!x.SUPABASE_ANON_KEY) process.exit(1)"
      - name: Login rejects invalid credentials safely
        run: |
          code=$(curl -sS -o /tmp/login.json -w "%{http_code}" -X POST https://juan-project-workspace-v2.vercel.app/api/login -H "Content-Type: application/json" --data '{"email":"maintenance-test@example.invalid","password":"definitely-not-valid"}')
          echo "Workspace login HTTP $code"
          cat /tmp/login.json
          test "$code" = "401"
      - name: Online catalog
        run: |
          code=$(curl -sS -o /tmp/catalog.json -w "%{http_code}" https://juan-project-online-juan-codes.vercel.app/api/catalog)
          echo "Online catalog HTTP $code"
          test "$code" = "200"
          node -e "const x=require('/tmp/catalog.json'); if(x.categories.length!==3||x.services.length!==18||x.packages.length!==4||x.packageItems.length!==39) process.exit(1)"
